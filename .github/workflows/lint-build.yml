name: CSS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # main の npm run build は監視を開始するため、CI では同じ入口を一度だけビルドする。
      - name: Build and verify CSS
        run: |
          node_modules/.bin/esbuild src/yapr.css --bundle --outfile=dist/yapr.css
          node_modules/.bin/esbuild src/yapr.css --bundle --minify --outfile=dist/yapr.min.css
          test -s dist/yapr.css
          test -s dist/yapr.min.css

      - uses: actions/upload-artifact@v4
        with:
          name: yapr-css
          path: dist/yapr*.css
          if-no-files-found: error
